<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistem Penilaian Inovasi 2027</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--primary:#155eef;--green:#134e5e;--orange:#e07b39;--metro-blue:#1e3a8a;--metro-yellow:#fbbf24}
    body{
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      font-family:Inter,'Segoe UI',Arial,sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
      background-size:300% 300%;
      animation:bgShift 15s ease infinite;
      padding:20px;
      position:relative;
    }
    body::before{
      content:"";position:absolute;inset:0;
      background:url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
      opacity:.4;
    }
    @keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

    /* Kartu Login */
    .login-card{
      background:white;
      border-radius:28px;
      padding:48px 42px 42px;
      width:min(480px,100%);
      box-shadow:0 40px 100px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1);
      animation:cardIn .6s cubic-bezier(.34,1.56,.64,1) both;
      position:relative;
      overflow:hidden;
      z-index:1;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
    .login-card::before{
      content:"";position:absolute;top:0;left:0;right:0;height:6px;
      background:linear-gradient(90deg, #dc2626, #fbbf24, #3b82f6);
      background-size:300% 100%;animation:bgShift 5s linear infinite;
    }

    /* Logo dan Header */
    .login-logo{text-align:center;margin-bottom:32px}
    .login-logo-icon{
      width:100px;height:100px;margin:0 auto 16px;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border-radius:20px;
      box-shadow:0 8px 24px rgba(30,58,138,.15);
      animation:logoFloat 3s ease-in-out infinite;
      position:relative;
    }
    @keyframes logoFloat{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}}
    .login-logo-icon::after{
      content:"";position:absolute;inset:0;border-radius:20px;
      box-shadow:inset 0 0 0 1px rgba(30,58,138,.1);
    }
    .login-logo-icon img{
      width:85%;height:85%;object-fit:contain;
      filter:drop-shadow(0 4px 8px rgba(0,0,0,.1));
    }
    .login-org{
      font-size:14px;font-weight:800;color:#6b7280;
      letter-spacing:.08em;text-transform:uppercase;
      margin-bottom:6px;
    }
    .login-title{
      font-size:24px;font-weight:900;color:#111827;
      margin-top:4px;line-height:1.3;
      background:linear-gradient(135deg, #1e3a8a, #3b82f6);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    /* Form */
    label{
      display:block;font-size:14px;font-weight:700;color:#374151;
      margin-bottom:8px;
    }
    .input-wrap{position:relative;margin-bottom:20px}
    .input-wrap input{
      width:100%;padding:14px 16px;
      border:2px solid #e5e7eb;border-radius:12px;
      font-size:15px;font-family:inherit;color:#111827;
      background:#f9fafb;transition:all .2s ease;outline:none;
    }
    .input-wrap input:hover{border-color:#d1d5db;background:#fff}
    .input-wrap input:focus{
      border-color:#3b82f6;background:white;
      box-shadow:0 0 0 4px rgba(59,130,246,.12), 0 4px 12px rgba(59,130,246,.08);
      transform:translateY(-1px);
    }
    .input-wrap .pw-toggle{
      position:absolute;right:14px;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;
      font-size:18px;color:#9ca3af;
      transition:.2s;padding:4px 8px;border-radius:6px;
    }
    .input-wrap .pw-toggle:hover{background:#f3f4f6;color:#3b82f6}

    /* Role badges hint */
    .role-hint{
      background:linear-gradient(135deg, #f0f9ff 0%, #f8fafc 100%);
      border:2px solid #e0e7ff;border-radius:16px;
      padding:18px;margin-bottom:24px;
      box-shadow:0 4px 12px rgba(0,0,0,.04);
    }
    .role-hint-title{
      font-size:12px;font-weight:800;color:#6b7280;
      text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;
      display:flex;align-items:center;gap:6px;
    }
    .role-hint-title::before{content:"👥";font-size:14px}
    .role-row{
      display:flex;align-items:center;gap:10px;
      margin-bottom:8px;font-size:13px;color:#374151;
      padding:4px 0;
    }
    .role-row:last-child{margin-bottom:0}
    .role-badge{
      font-size:10px;font-weight:800;padding:4px 10px;border-radius:8px;
      white-space:nowrap;flex-shrink:0;
      box-shadow:0 2px 4px rgba(0,0,0,.08);
    }
    .rb-admin{background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:white}
    .rb-judul{background:linear-gradient(135deg,#34d399,#10b981);color:white}
    .rb-sid{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:white}

    /* Submit */
    .login-btn{
      width:100%;padding:16px;
      background:linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      color:white;border:none;border-radius:14px;
      font-size:16px;font-weight:800;font-family:inherit;
      cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);
      position:relative;overflow:hidden;
      box-shadow:0 8px 20px rgba(37,99,235,.3), 0 2px 8px rgba(0,0,0,.1);
    }
    .login-btn::before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(135deg, rgba(255,255,255,.2), transparent);
      opacity:0;transition:.3s;
    }
    .login-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 32px rgba(37,99,235,.4), 0 4px 12px rgba(0,0,0,.15);
    }
    .login-btn:hover::before{opacity:1}
    .login-btn:active{transform:translateY(-1px) scale(.98)}
    .login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}

    /* Error */
    .login-error{
      background:linear-gradient(135deg, #fee2e2 0%, #fef2f2 100%);
      border:2px solid #fca5a5;
      border-radius:12px;padding:12px 16px;
      font-size:13px;color:#dc2626;font-weight:700;
      margin-bottom:20px;display:none;
      animation:shake .4s ease, fadeIn .3s ease;
      box-shadow:0 4px 12px rgba(220,38,38,.15);
    }
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
    .login-error.show{display:block}

    /* Loading spinner */
    .spinner{
      display:inline-block;width:18px;height:18px;
      border:3px solid rgba(255,255,255,.3);
      border-top-color:white;border-radius:50%;
      animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Footer text */
    .login-footer{
      text-align:center;margin-top:24px;padding-top:20px;
      border-top:2px solid #f3f4f6;
      font-size:12px;color:#9ca3af;
    }
    .login-footer strong{color:#6b7280}

    /* Responsive */
    @media (max-width:480px){
      .login-card{padding:36px 28px 28px}
      .login-logo-icon{width:85px;height:85px}
      .login-title{font-size:20px}
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-icon">
      <!-- Logo Kota Metro -->
      <img src="logo-metro.jpg" alt="Logo Kota Metro" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%231e3a8a%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23fbbf24%22 font-size=%2232%22 font-weight=%22bold%22 font-family=%22Arial%22%3EMETRO%3C/text%3E%3C/svg%3E'">
    </div>
    <div class="login-org">BAPPERIDA Kota Metro</div>
    <div class="login-title">Sistem Penilaian Inovasi Daerah </div>
  </div>

  <div class="role-hint">
    <div class="role-hint-title">Akun yang tersedia</div>
    <div class="role-row"><span class="role-badge rb-admin">Super Admin</span> username: <b>admin</b></div>
    <div class="role-row"><span class="role-badge rb-judul">Juri Judul</span> eva.rolia · arif.joko · mustafa</div>
    <div class="role-row"><span class="role-badge rb-sid">Juri SID</span> sowiyah · etik.puji</div>
    <div style="font-size:11px;color:#9ca3af;margin-top:6px">Semua password: <b>juri2027</b> (kecuali admin: <b>admin2027</b>)</div>
  </div>

  <div id="loginError" class="login-error"></div>

  <div class="input-wrap">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Masukkan username…" autocomplete="username" autofocus>
  </div>

  <div class="input-wrap">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Masukkan password…" autocomplete="current-password">
    <button class="pw-toggle" onclick="togglePw()" type="button" id="pwToggle">👁</button>
  </div>

  <button class="login-btn" id="loginBtn" onclick="doLogin()"> Masuk</button>
  
  <div class="login-footer">
    <strong>BAPPERIDA Kota Metro</strong> <br>
    Sistem Penilaian Inovasi Daerah
  </div>
</div>

<script src="auth.js"></script>
<script>
  // Jika sudah login, redirect sesuai role
  const existingSession = getSession();
  if (existingSession) {
    const cfg = { admin:"dashboard.html", juri_judul:"penilaian.html", juri_sid:"penilaian.html" };
    window.location.replace(cfg[existingSession.role] || "login.html");
  }

  function togglePw() {
    const inp = document.getElementById("password");
    const btn = document.getElementById("pwToggle");
    inp.type = inp.type === "password" ? "text" : "password";
    btn.textContent = inp.type === "password" ? "👁" : "🙈";
  }

  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });
  document.getElementById("username").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("password").focus();
  });

  function doLogin() {
    const btn      = document.getElementById("loginBtn");
    const errEl    = document.getElementById("loginError");
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (!username || !password) {
      showError("Username dan password wajib diisi.");
      return;
    }

    // Tampilkan loading
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Memverifikasi…';
    errEl.classList.remove("show");

    setTimeout(() => {
      const result = login(username, password);
      if (!result.ok) {
        showError(result.msg);
        btn.disabled = false;
        btn.innerHTML = "Masuk";
        return;
      }
      // Sukses — animasi lalu redirect
      btn.innerHTML = "✅ Berhasil!";
      btn.style.background = "linear-gradient(135deg,#10b981,#059669)";
      setTimeout(() => { window.location.href = result.redirect; }, 700);
    }, 600);
  }

  function showError(msg) {
    const el = document.getElementById("loginError");
    el.textContent = "❌ " + msg;
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
  }
</script>
</body>
</html>
